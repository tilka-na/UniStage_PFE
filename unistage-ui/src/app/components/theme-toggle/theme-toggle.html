<button (click)="toggleTheme()" 
        class="p-2 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-yellow-400 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors duration-300 shadow-sm flex items-center justify-center w-10 h-10">
  
  @if (isDarkMode) {
    <span class="text-xl leading-none">☀️</span>
  } @else {
    <span class="text-xl leading-none">🌙</span>
  }
  
</button>
