<div class="p-8 bg-slate-50 dark:bg-slate-950 min-h-screen">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-black mb-8 text-slate-900 dark:text-white">Annuaire des Utilisateurs</h1>

    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
      <table class="w-full text-left">
        <thead class="border-b border-slate-100 dark:border-slate-800">
        <tr>
          <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Utilisateur</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Rôle</th>
          <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Statut</th>
          <th class="px-6 py-4 text-right text-xs font-bold text-slate-400 uppercase">Action</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-50 dark:divide-slate-800">
        <tr *ngFor="let user of users" class="group">
          <td class="px-6 py-4">
            <div class="text-sm font-bold text-slate-900 dark:text-white">{{ user.email }}</div>
            <div class="text-xs text-slate-400">ID: #{{ user.id }}</div>
          </td>
          <td class="px-6 py-4">
              <span [ngClass]="{
                'bg-purple-100 text-purple-700': user.role === 'ADMIN',
                'bg-blue-100 text-blue-700': user.role === 'STUDENT',
                'bg-orange-100 text-orange-700': user.role === 'RECRUITER',
                'bg-green-100 text-green-700': user.role === 'ENCADRANT'
              }" class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase">
                {{ user.role }}
              </span>
          </td>
          <td class="px-6 py-4">
              <span *ngIf="user.enabled" class="flex items-center gap-1.5 text-xs font-bold text-emerald-500">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Actif
              </span>
            <span *ngIf="!user.enabled" class="flex items-center gap-1.5 text-xs font-bold text-red-500">
                <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> Suspendu
              </span>
          </td>
          <td class="px-6 py-4 text-right">
            <button (click)="toggleUserStatus(user)"
                    [class]="user.enabled ? 'text-red-600 bg-red-50 hover:bg-red-100' : 'text-emerald-600 bg-emerald-50 hover:bg-emerald-100'"
                    class="px-4 py-2 rounded-xl text-xs font-bold transition-all">
              {{ user.enabled ? 'Suspendre' : 'Activer' }}
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
