<div class="min-h-screen bg-slate-50 dark:bg-slate-950 py-10 px-4 transition-colors duration-300">
  <div class="max-w-5xl mx-auto bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-gray-100 dark:border-slate-800 overflow-hidden">

    <div class="bg-gradient-to-r from-slate-900 to-slate-800 dark:from-black dark:to-slate-900 px-8 py-8 text-white">
      <h1 class="text-3xl font-bold">Mon Profil Candidat</h1>
      <p class="text-slate-300 mt-2">Construisez votre dossier pour décrocher le stage idéal.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="p-8 space-y-10">

      <section>
        <h3 class="flex items-center text-lg font-bold text-slate-800 dark:text-white mb-6 border-b border-slate-200 dark:border-slate-700 pb-2">Informations Personnelles</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Prénom</label>
            <input type="text" [(ngModel)]="profile.firstName" name="firstName" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all">
          </div>
          <div>
            <label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Nom de famille</label>
            <input type="text" [(ngModel)]="profile.lastName" name="lastName" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all">
          </div>

          <div>
            <label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">CNE (Code National Étudiant)</label>
            <input type="text" [(ngModel)]="profile.cne" name="cne"
                   class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all">
          </div>

          <div>
            <label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Téléphone</label>
            <input type="text" [(ngModel)]="profile.phone" name="phone" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all">
          </div>

          <div class="md:col-span-2">
            <label class="block mb-2 text-sm font-semibold text-slate-700 dark:text-slate-300">Université / École</label>
            <input type="text" [(ngModel)]="profile.university" name="university" required
                   class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all">
          </div>
        </div>
      </section>

      <section>
        <h3 class="flex items-center text-lg font-bold text-slate-800 dark:text-white mb-6 border-b border-slate-200 dark:border-slate-700 pb-2">Compétences Techniques</h3>
        <textarea [(ngModel)]="profile.skills" name="skills" rows="3" placeholder="Ex: Java, Spring Boot, Angular, PostgreSQL..."
                  class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none dark:bg-slate-800 dark:border-slate-700 dark:text-white transition-all"></textarea>
      </section>

      <section>
        <div class="flex justify-between items-end mb-6 border-b border-slate-200 dark:border-slate-700 pb-2">
          <h3 class="flex items-center text-lg font-bold text-slate-800 dark:text-white">Expérience & Projets</h3>
          <button type="button" (click)="addExperience()"
                  class="text-sm font-semibold text-green-600 hover:text-green-700 dark:text-green-400 hover:underline">+ Ajouter une expérience</button>
        </div>

        <div *ngFor="let exp of profile.experiences; let i = index"
             class="mb-6 p-5 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 relative group">

          <button type="button" (click)="removeExperience(i)"
                  class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors text-sm font-medium">
            Supprimer
          </button>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
            <input type="text" [(ngModel)]="exp.title" [name]="'expTitle'+i" placeholder="Titre du poste"
                   class="w-full bg-transparent border-b border-slate-300 dark:border-slate-600 focus:border-green-500 px-0 py-2 font-semibold text-slate-800 dark:text-white outline-none">
            <input type="text" [(ngModel)]="exp.organization" [name]="'expOrg'+i" placeholder="Entreprise / Organisation"
                   class="w-full bg-transparent border-b border-slate-300 dark:border-slate-600 focus:border-green-500 px-0 py-2 text-slate-700 dark:text-slate-300 outline-none">
          </div>

          <input type="text" [(ngModel)]="exp.period" [name]="'expPeriod'+i" placeholder="Période (ex: Juin 2025 - Sept 2025)"
                 class="w-full bg-transparent border-b border-slate-300 dark:border-slate-600 focus:border-green-500 mb-3 px-0 py-2 text-sm text-slate-600 dark:text-slate-400 outline-none">

          <textarea [(ngModel)]="exp.description" [name]="'expDesc'+i" rows="2" placeholder="Décrivez vos missions et accomplissements..."
                    class="w-full bg-white dark:bg-slate-900 rounded p-3 border border-slate-200 dark:border-slate-700 text-sm focus:ring-1 focus:ring-green-500 outline-none dark:text-slate-300"></textarea>
        </div>
      </section>

      <section>
        <h3 class="flex items-center text-lg font-bold text-slate-800 dark:text-white mb-6 border-b border-slate-200 dark:border-slate-700 pb-2">Documents Joints</h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-4">
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Curriculum Vitae (PDF)</label>

            <div *ngIf="profile.cvUrl" class="flex items-center gap-2 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-100 dark:border-blue-800">
              <span class="text-blue-600">📄</span>
              <div class="flex-1 overflow-hidden">
                <a [href]="'http://localhost:8084' + profile.cvUrl" target="_blank" class="text-sm font-bold text-blue-600 hover:underline truncate block">
                  Voir le CV actuel
                </a>
              </div>
            </div>

            <input type="file" (change)="onCvSelected($event)" accept=".pdf"
                   class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 dark:file:bg-slate-800 dark:file:text-slate-300">
          </div>

          <div class="space-y-4">
            <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Lettre de Motivation (PDF)</label>

            <div *ngIf="profile.coverLetterUrl" class="flex items-center gap-2 p-3 bg-orange-50 dark:bg-orange-900/20 rounded-lg border border-orange-100 dark:border-orange-800">
              <span class="text-orange-600">✉️</span>
              <div class="flex-1 overflow-hidden">
                <a [href]="'http://localhost:8084' + profile.coverLetterUrl" target="_blank" class="text-sm font-bold text-orange-600 hover:underline truncate block">
                  Voir la lettre actuelle
                </a>
              </div>
            </div>

            <input type="file" (change)="onCoverLetterSelected($event)" accept=".pdf"
                   class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-slate-800 dark:file:text-slate-300">
          </div>
        </div>
      </section>

      <div class="pt-6 border-t border-slate-200 dark:border-slate-800">
        <div *ngIf="error" class="mb-4 text-red-600 bg-red-50 dark:bg-red-900/20 p-4 rounded-lg border border-red-100 dark:border-red-900/30">
          {{ error }}
        </div>
        <div *ngIf="success" class="mb-4 text-green-600 bg-green-50 dark:bg-green-900/20 p-4 rounded-lg border border-green-100 dark:border-green-900/30">
          {{ success }}
        </div>

        <div class="flex justify-end gap-4">
          <button type="submit" [disabled]="isSubmitting"
                  class="px-8 py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg transition-all shadow-lg shadow-orange-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="isSubmitting">Envoi en cours...</span>
            <span *ngIf="!isSubmitting">Enregistrer le profil</span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
