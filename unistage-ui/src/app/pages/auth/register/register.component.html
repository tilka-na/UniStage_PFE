<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-darkBg transition-colors">
  <div class="w-full max-w-md bg-white dark:bg-darkCard rounded-xl shadow-lg p-8">

    <h1 class="text-2xl font-bold text-center text-gray-900 dark:text-white mb-4">Create an account</h1>
    <p class="text-center text-gray-500 dark:text-gray-300 mb-6">
      Join UniStage today
    </p>

    <div class="flex justify-center gap-2 mb-4">
      <button
        type="button"
        (click)="setRole('STUDENT')"
        [class.bg-blueAccent]="role === 'STUDENT'"
        [class.text-white]="role === 'STUDENT'"
        class="px-4 py-2 border rounded-lg text-gray-700 dark:text-gray-300 transition-all">
        Student
      </button>

      <button
        type="button"
        (click)="setRole('COMPANY')"
        [class.bg-gold]="role === 'COMPANY'"
        [class.text-white]="role === 'COMPANY'"
        class="px-4 py-2 border rounded-lg text-gray-700 dark:text-gray-300 transition-all">
        Company
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blueAccent dark:focus:ring-gold bg-white dark:bg-darkInput border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blueAccent dark:focus:ring-gold bg-white dark:bg-darkInput border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white"
      />

      <input
        type="password"
        placeholder="Confirm Password"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blueAccent dark:focus:ring-gold bg-white dark:bg-darkInput border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white"
      />

      <button
        type="submit"
        class="w-full bg-blueAccent dark:bg-gold text-white py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-orange-600 transition-all shadow-md"
      >
        Register
      </button>

      <p *ngIf="error" class="text-red-500 text-sm text-center mt-2">{{ error }}</p>

    </form>

    <p class="text-center text-sm text-gray-500 dark:text-gray-300 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-blueAccent dark:text-gold font-semibold">Login</a>
    </p>

  </div>
</div>
