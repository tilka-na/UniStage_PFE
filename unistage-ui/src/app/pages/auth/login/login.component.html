<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-darkBg transition-colors">
  <div class="w-full max-w-md bg-white dark:bg-darkCard rounded-xl shadow-lg p-8">

    <h1 class="text-2xl font-bold text-center text-gray-900 dark:text-white mb-4">Welcome back</h1>
    <p class="text-center text-gray-500 dark:text-gray-300 mb-6">
      Sign in to your account
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blueAccent dark:focus:ring-gold bg-white dark:bg-darkInput border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white"
      />

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
        class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blueAccent dark:focus:ring-gold bg-white dark:bg-darkInput border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white"
      />

      <button
        type="submit"
        class="w-full bg-blueAccent dark:bg-gold text-white py-2 rounded-lg hover:bg-blue-700 dark:hover:bg-orange-600 transition-all shadow-md"
      >
        Login
      </button>

      <p *ngIf="error" class="text-red-500 text-sm text-center mt-2">{{ error }}</p>

    </form>

    <p class="text-center text-sm text-gray-500 dark:text-gray-300 mt-6">
      Don’t have an account?
      <a routerLink="/register" class="text-blueAccent dark:text-gold font-semibold">Register</a>
    </p>

  </div>
</div>
