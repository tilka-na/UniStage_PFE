version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: unistage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d # Creates auth_db, internship_db, profile_db

  mongodb:
    image: mongo:6
    container_name: unistage-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: unistage-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: unistage-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  eureka-server:
    container_name: unistage-eureka
    build: ./eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  auth-service:
    container_name: unistage-auth
    build: ./auth-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      EUREKA_HOST: eureka-server
    ports:
      - "8081:8081"

  profile-service:
    container_name: unistage-profile
    build: ./profile-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/profile_db
      EUREKA_HOST: eureka-server
    ports:
      - "8082:8082"

  internship-service:
    container_name: unistage-internship
    build: ./internship-service
    restart: on-failure
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/internship_db
      KAFKA_HOST: kafka
      EUREKA_HOST: eureka-server
    ports:
      - "8083:8083"

  document-service:
    container_name: unistage-document
    build: ./document-service
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_started
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8084:8084"

  notification-service:
    container_name: unistage-notification
    build: ./notification-service
    restart: on-failure
    depends_on:
      kafka:
        condition: service_started
      mongodb:
        condition: service_started
      eureka-server:
        condition: service_healthy
    environment:
      KAFKA_HOST: kafka
      EUREKA_HOST: eureka-server
    ports:
      - "8085:8085"

  api-gateway:
    container_name: unistage-gateway
    build: ./api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_HOST: eureka-server
    ports:
      - "8080:8080"

  frontend:
    container_name: unistage-frontend
    build: ./unistage-ui
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mongo_data:
