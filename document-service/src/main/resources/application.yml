server:
  port: 8084
spring:
  application:
    name: document-service
  data:
    mongodb:
      # Changed localhost -> mongodb
      uri: mongodb://mongodb:27017/documentdb

eureka:
  client:
    service-url:
      # Changed localhost -> eureka-server
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true