spring.application.name=internship-service
server.port=8083

# --- POSTGRESQL CONFIG (PC local) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/internship_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- KAFKA CONFIG ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Zidi had l-ligne bach mat-tra lik hta error f l-format dial l-JSON
spring.kafka.producer.properties.spring.json.trusted.packages=*
# --- EUREKA CONFIG ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false